  note: E2. The exported JSON Schemas under schemas/v1 and the MCP tools, resource and prompt as tools/list, resources/list and prompts/list publish them. A metadata action open to all four roles (build plan, "New contracts and matrix changes"); the governed catalog read is taken first, and no schema_id is looked up before it allows. A refusal is the neutral denial page, the same for any schema asked for.
