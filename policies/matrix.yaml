version: 1
roles:
- advisor
- ops
- compliance
- engineer
notes:
- OPA precedes existence lookup. Advisor coverage is direct or via current team; current
  grants apply to historical queries.
- Ops decisions except metric definitions use no_pii, including their quality provenance
  and conversation context.
- Trace payload metadata is own-principal only except compliance; engineer trace/conversation
  scope must be empty.
- Bootstrap/control metadata contains no private business facts and does not create
  tool result evidence. Each dispatched business operation is durably audited.
- Filtered candidate actions become exact all-scope checks when recorded results or
  handles are redisclosed.
- Live chat checks conversation ownership and current policy before provider construction;
  each data tool and terminal answer is independently governed. History is a freshly
  authorized display projection, never the stored provider transcript.
- A page-route row may carry a menu field (label, group, roles). It decides only which
  roles' navigation lists the page; its roles must be allowed by the row's action, and
  policy still decides every request. The workbench derives its public and authenticated
  path sets from the /workbench rows here.
- trace_spans (ADR 0009 section 7) is the trace's only owner or compliance, over every
  household of the trace's validated results; engineers and operations are refused at its
  preflight. The accepted trace_scope rule is unchanged (build plan decision 13).
- General answer verification is allowed only over own-conversation results after
  each originating action and projection reauthorizes; the scripted financial demo
  additionally requires snapshot access.
