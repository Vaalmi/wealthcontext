  note: Workbench REST only, never an MCP tool (ADR 0009 section 7). trace_spans_preflight on the empty scope; the trace's owner and recorded evidence validated as trace validates them; trace_spans over every household of its validated results; only then is the span export opened. Allowlisted span fields only.
- method: POST
  path: /api/feed_health
