  note: A1 and A1b. list_households, then one get_household_snapshot per listed household at the session's cutoffs, then book concentration; each independently governed. No book total. A refusal of list_households is the neutral denial page.
  menu:
    label: My book
    group: Workspace
    roles: [advisor]
- method: GET
  path: /workbench/household
  action: snapshot
  authentication: required
  business: true
  kind: business
  note: A2 and A4. One governed get_household_snapshot at the session's cutoffs; the household comes from the query or the session context, and only its shape is checked before the call. A refusal is the A5 neutral denial page, the same for an existing and an unknown household.
  menu:
    label: Household
    group: Workspace
    roles: [advisor]
- method: GET
  path: /workbench/household/reconciliation
  action: snapshot
  authentication: required
  business: true
  kind: business
  note: A6, a tab of the household page with no menu entry of its own. Reads the reconciliation the same governed snapshot returns; refusals as on /workbench/household.
- method: GET
  path: /workbench/household/exposure
  action: portfolio_exposure
  authentication: required
  business: true
  kind: business
  note: A2's exposure tab, with no menu entry of its own. One governed get_portfolio_exposure (by issuer) at the session's cutoffs; refusals as on /workbench/household.
- method: GET
  path: /workbench/decisions
  action: view_decision_log
  authentication: required
  business: true
  kind: business
  note: C1. One governed decision_log_page; the filters and cursor pass to the platform unread, which decides on the empty scope before it decodes the cursor or applies a filter. Entitlement facts are those at the stored revision, labelled FACTS_AT_STORED_REVISION. A refusal is the neutral denial page. No export control (ADR 0009 point 5).
  menu:
    label: Access decisions
    group: Compliance
    roles: [compliance]
- method: GET
  path: /workbench/point-in-time
  action: household_receipts
  authentication: required
  business: true
  kind: business
  note: C2. For the session's cutoff and the page's comparison cutoff (a page parameter, never session context), one governed household_receipts and one governed get_household_snapshot each; the receipts call comes first, and a refusal is the neutral denial page before any snapshot is read. The two receipts lists are compared by run ID only; no figure is differenced.
  menu:
    label: Point in time
    group: Compliance
    roles: [compliance]
- method: GET
  path: /workbench/trace
  action: trace_spans
  authentication: required
  business: true
  kind: business
  note: C3. One governed trace_spans for the query's trace, then today's trace metadata for the action names; without a trace ID the page reads nothing. No attributes; when span_source is UNAVAILABLE the page shows the trace metadata alone. In the compliance menu only; an advisor reaches their own run's trace from a link on their A3 answer (ADR 0009 point 13); policy decides every request.
  menu:
    label: Trace
    group: Compliance
    roles: [compliance]
- method: GET
  path: /workbench/data-health
  action: feed_runs
  authentication: required
  business: true
  kind: business
  note: O1. One governed feed_health over the range (default from the data window's first business day to the session's valuation date, at most 25 business days) at the session's cutoff, then one governed get_data_quality_report on the range's last day for the only tile, incomplete_household_count. Every expected cell, NOT_RECEIVED included, as a grid with a glyph and a word per cell and as a table. A refusal is the neutral denial page. No export control (ADR 0009 point 5).
  menu:
    label: Data health
    group: Operations
    roles: [ops]
- method: GET
  path: /workbench/feed-run
  action: feed_runs
  authentication: required
  business: true
  kind: business
  note: O2. One governed feed_run_impact for the run, then one governed get_data_quality_report at the run's business date for each affected household's completeness. A preset names a cell; the run ID comes from that cell of an authorized feed_health. Stored reason codes, IDs only; null counts for feeds without per-account availability. A refusal is the neutral denial page, the same for an existing and an unknown run. In the operations menu only (ADR 0009 point 13).
  menu:
    label: Feed run
    group: Operations
    roles: [ops]
- method: GET
  path: /workbench
  action: conversation_context
  authentication: required
  business: true
  kind: business
  note: Local demo session; freshly authorized conversation history. Retired from the engineer menu by the owner on 2026-11-10, when E1 and E2 became the engineer's screens; the route stays and policy still decides access.
  menu:
    label: Ask
    group: Workspace
    roles: [advisor, ops, compliance]
- method: GET
  path: /workbench/revocation
  action: conversation_context
  authentication: required
  business: true
  kind: business
  note: A7, the seeded revocation (S04, Q02). Entered by a link from the "Current access" scenario, with no preset and no menu entry of its own (ADR 0009). For ADV-03 it opens this session's own seeded store, a copy of one store staged once per process with the evaluation runtime's Q02 staging, capped and deleted when the session ends; the main demo database is not read. Renders the freshly reauthorized conversation, whose earlier turn is paired tombstones. Any other persona gets a notice and nothing is staged or read.
- method: POST
  path: /workbench/revocation/answer
  action: conversation_context
  authentication: required
  business: true
  kind: business
  note: Same-origin CSRF. Replays the one genuine recorded follow-up (decision 12) once per seeded store, against freshly reauthorized context, with no data tool offered; no provider key and no new retrieval.
- method: GET
  path: /workbench/revocation/evidence
  action: provenance
  authentication: required
  business: true
  kind: business
  note: A source handle issued with A7's earlier result. The pair is checked in memory against the earlier turn of this session's seeded store before anything is read, then get_data_provenance reauthorizes it there; a revoked handle and one never issued get the same neutral denial.
- method: GET
  path: /workbench/claim
