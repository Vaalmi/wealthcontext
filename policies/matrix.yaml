  authentication: required
  business: true
  kind: business
  tool: feed_health
  note: Workbench REST only, never an MCP tool (ADR 0009 section 3). feed_runs on the empty scope before either date is resolved; then feed_runs exactly over every household active on any day of the range at the cutoff. One cell per expected source-and-feed pair (the closed table of the fifteen FEED_SOURCES pairs) per business day, NOT_RECEIVED included, at most 375; identifiers, codes, counts and timestamps only.
- method: POST
  path: /api/feed_run_impact
  action: feed_runs
  authentication: required
  business: true
  kind: business
  tool: feed_run_impact
  note: Workbench REST only, never an MCP tool (ADR 0009 section 4). feed_runs on the empty scope before the run is looked up; an unknown run and one recorded after the cutoff are the same NOT_FOUND; then feed_runs exactly over the households active on the run's business date. Expected accounts from the run's manifest; stored reason codes; households attributed at query time; null counts for feeds without per-account availability. IDs only.
