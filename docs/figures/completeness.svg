<svg class="dg" viewBox="-14 -14 1028 628" width="1028" height="628" role="img" aria-label="Completeness flow: a position is valued only with a PAS snapshot, a fresh price and an FX rate; any gap marks the household INCOMPLETE with no total. Right: trade-date reconciliation example where 1,200 PAS shares minus 1,000 custody shares equals a 200-share pending buy." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg:#F2F4F3;--panel:#FBFCFB;--surface:#FFFFFF;--surface-2:#E9ECEB;--zone:#F4F6F5;--fg:#18202B;--fg-muted:#566070;--line:#CDD3D6;--line-strong:#7B8592;--edge:#46505E;--accent:#2756A6;--accent-soft:#E2EAF7;--ok:#1F7A4D;--ok-soft:#DFF1E7;--warn:#9C5B0E;--warn-soft:#FAEBD5;--deny:#B02A22;--deny-soft:#F8E1DF;--display:Georgia, "Times New Roman", serif;--body:"IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;--mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){svg{--bg:#11161C;--panel:#161C23;--surface:#1D242D;--surface-2:#252D38;--zone:#192028;--fg:#E5E9EE;--fg-muted:#9AA4B1;--line:#323B47;--line-strong:#6A7584;--edge:#A9B2BF;--accent:#8EB2F2;--accent-soft:#1D2C47;--ok:#6FCB9A;--ok-soft:#163325;--warn:#E8B062;--warn-soft:#382813;--deny:#F28B83;--deny-soft:#3B1C1A;}}
.panel{fill:var(--panel);stroke:var(--line)}
.dg text{font-family:var(--body)}
.dg .tt{font-size:13px;font-weight:600;fill:var(--fg)}
.dg .ts{font-size:11.5px;fill:var(--fg-muted)}
.dg .lbl{font-size:11px;fill:var(--fg-muted)}
.dg .mono{font-family:var(--mono)}
.dg .tt.mono{font-size:12.5px}
.dg .strong{fill:var(--fg);font-weight:600}
.dg .big{font-family:var(--display);font-size:22px;font-weight:600;fill:var(--fg)}
.dg .axt{fill:var(--fg);font-weight:500}
.dg .zl{font-size:10.5px;letter-spacing:.08em;font-weight:600;fill:var(--fg-muted)}
.dg .chipt{font-size:11.5px;font-weight:600}
.dg .accentt{fill:var(--accent)} .dg .okt{fill:var(--ok)} .dg .warnt{fill:var(--warn)} .dg .denyt{fill:var(--deny)}
.dg .lbg{fill:var(--panel)}
.dg .zone{fill:var(--zone);stroke:var(--line);stroke-dasharray:5 4}
.dg .box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.1}
.dg .box.q{stroke-width:1.6}
.dg .box.accent{fill:var(--accent-soft);stroke:var(--accent)}
.dg .box.ok{fill:var(--ok-soft);stroke:var(--ok)}
.dg .box.warn{fill:var(--warn-soft);stroke:var(--warn)}
.dg .box.deny{fill:var(--deny-soft);stroke:var(--deny)}
.dg .box.muted{fill:var(--surface-2);stroke:var(--line)}
.dg .box.ghost{fill:none;stroke:var(--line-strong);stroke-dasharray:6 4}
.dg .edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.dg .edge.accent{stroke:var(--accent)} .dg .edge.ok{stroke:var(--ok)} .dg .edge.deny{stroke:var(--deny)} .dg .edge.warn{stroke:var(--warn)}
.dg .edge.dash{stroke-dasharray:5 4}
.dg .edge.divider{stroke:var(--accent);stroke-dasharray:2 4;stroke-width:1.6}
.dg .edge.guide{stroke:var(--fg-muted);stroke-dasharray:4 4;stroke-width:1.1}
.dg .edge.guide.accent{stroke:var(--accent)}
.dg .edge.life{stroke:var(--line-strong);stroke-dasharray:3 5;stroke-width:1}
.dg .edge.axis{stroke:var(--fg-muted);stroke-width:1}
.dg .head{fill:var(--edge)} .dg .head.accent{fill:var(--accent)} .dg .head.ok{fill:var(--ok)} .dg .head.deny{fill:var(--deny)} .dg .head.warn{fill:var(--warn)}
.dg .reg0{fill:var(--surface-2)} .dg .reg1{fill:var(--surface)} .dg .reg2{fill:var(--accent-soft)}
.dg .plotframe{fill:none;stroke:var(--line-strong)}
.dg .dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.dg .bar{fill:var(--line-strong)} .dg .bar.accent{fill:var(--accent)}
.dg .bar.pending{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:3 3}
.dg .bar.ghost{fill:none;stroke:var(--line-strong);stroke-dasharray:5 4}
.dg .tt14{font-size:14px;font-weight:600;fill:var(--fg)}
.dg .bt{font-size:13.5px;fill:var(--fg)}
.dg .bq{font-size:15.5px;font-weight:500;fill:var(--fg)}
.dg .hl{fill:var(--accent);font-weight:700}
.dg .person{fill:var(--line-strong)}
.dg .bubble{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.1}
.dg .bubble.soft{fill:var(--surface-2);stroke:none}
.dg .bubble.deny{fill:var(--deny-soft);stroke:var(--deny)}
.dg .bubble.accent{fill:var(--accent-soft);stroke:var(--accent)}
.dg .badge{fill:var(--deny)}
.dg .badget{font-size:11px;font-weight:700;fill:var(--panel)}
.dg .card{fill:var(--surface);stroke:var(--line)}
.dg .dotc.warn{fill:var(--warn)} .dg .dotc.deny{fill:var(--deny)}
.dg .step{fill:var(--surface);stroke:var(--line-strong);stroke-width:2}
.dg .step.accent{fill:var(--accent-soft);stroke:var(--accent)} .dg .step.ok{fill:var(--ok-soft);stroke:var(--ok)}
.dg .stepn{font-family:var(--display);font-size:19px;font-weight:600;fill:var(--fg)}</style><rect class="panel" x="-13.5" y="-13.5" width="1027" height="627" rx="10"/><defs><marker id="cmp-base" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head base"/></marker></defs><rect class="zone" x="640" y="20" width="340" height="560" rx="12"/><text class="zl" x="654" y="40">TRADE-DATE RECONCILIATION</text><path class="edge " d="M 180.0 60.0 L 180.0 90.0" marker-end="url(#cmp-base)"/><path class="edge " d="M 180.0 134.0 L 180.0 164.0" marker-end="url(#cmp-base)"/><path class="edge " d="M 180.0 208.0 L 180.0 238.0" marker-end="url(#cmp-base)"/><path class="edge " d="M 180.0 282.0 L 180.0 312.0" marker-end="url(#cmp-base)"/><path class="edge " d="M 180.0 364.0 L 180.0 396.0" marker-end="url(#cmp-base)"/><path class="edge " d="M 155.0 440.0 L 155.0 490.0" marker-end="url(#cmp-base)"/><path class="edge " d="M 320.0 112.0 L 370.0 112.0" marker-end="url(#cmp-base)"/><path class="edge " d="M 320.0 186.0 L 370.0 186.0" marker-end="url(#cmp-base)"/><path class="edge " d="M 320.0 260.0 L 370.0 260.0" marker-end="url(#cmp-base)"/><path class="edge " d="M 580.0 112.0 L 600.0 112.0"/><path class="edge " d="M 580.0 186.0 L 600.0 186.0"/><path class="edge " d="M 580.0 260.0 L 600.0 260.0"/><path class="edge " d="M 600.0 112.0 L 600.0 470.0"/><path class="edge " d="M 600.0 470.0 L 470.0 470.0 L 470.0 490.0" marker-end="url(#cmp-base)"/><path class="edge " d="M 320.0 418.0 L 400.0 418.0 L 400.0 490.0" marker-end="url(#cmp-base)"/><rect class="box muted" x="40" y="20" width="280" height="40" rx="7"/><text class="tt mutedt" x="180.0" y="43.5" text-anchor="middle">Each position and cash balance</text><rect class="box q" x="40" y="90" width="280" height="44" rx="7"/><text class="tt qt" x="180.0" y="115.5" text-anchor="middle">PAS snapshot for this account?</text><rect class="box q" x="40" y="164" width="280" height="44" rx="7"/><text class="tt qt" x="180.0" y="189.5" text-anchor="middle">Fresh price on or before the date?</text><rect class="box q" x="40" y="238" width="280" height="44" rx="7"/><text class="tt qt" x="180.0" y="263.5" text-anchor="middle">FX rate available (non-USD)?</text><rect class="box ok" x="40" y="312" width="280" height="52" rx="7"/><text class="tt okt" x="180.0" y="334.0" text-anchor="middle">Valued</text><text class="ts" x="180.0" y="350.0" text-anchor="middle">PAS quantity × price × FX, in Decimal</text><rect class="box q" x="40" y="396" width="280" height="44" rx="7"/><text class="tt qt" x="180.0" y="421.5" text-anchor="middle">All valued? Membership resolved?</text><rect class="box ok" x="40" y="490" width="230" height="96" rx="7"/><text class="tt okt" x="155.0" y="519.0" text-anchor="middle">COMPLETE</text><text class="ts" x="155.0" y="535.0" text-anchor="middle">total shown</text><text class="ts" x="155.0" y="550.0" text-anchor="middle">assets &gt; 0: breach or not</text><text class="ts" x="155.0" y="565.0" text-anchor="middle">assets ≤ 0: indeterminate[]</text><rect class="box warn" x="290" y="490" width="280" height="96" rx="7"/><text class="tt warnt" x="430.0" y="511.5" text-anchor="middle">INCOMPLETE</text><text class="ts" x="430.0" y="527.5" text-anchor="middle">fresh subtotal, no total</text><text class="ts" x="430.0" y="542.5" text-anchor="middle">stale list with last-known values</text><text class="ts" x="430.0" y="557.5" text-anchor="middle">missing list</text><text class="ts" x="430.0" y="572.5" text-anchor="middle">concentration → indeterminate[]</text><rect class="box warn" x="370" y="90" width="210" height="44" rx="7"/><text class="tt mono warnt" x="475.0" y="115.5" text-anchor="middle">SOURCE_UNAVAILABLE</text><rect class="box warn" x="370" y="164" width="210" height="44" rx="7"/><text class="tt mono warnt" x="475.0" y="182.0" text-anchor="middle">PRICE_STALE</text><text class="ts" x="475.0" y="198.0" text-anchor="middle">none at all: SOURCE_UNAVAILABLE</text><rect class="box warn" x="370" y="238" width="210" height="44" rx="7"/><text class="tt mono warnt" x="475.0" y="263.5" text-anchor="middle">FX_UNAVAILABLE</text><rect class="bar accent" x="660" y="102" width="240" height="18" rx="3"/><rect class="bar" x="660" y="150" width="200" height="18" rx="3"/><rect class="bar pending" x="860" y="150" width="40" height="18" rx="3"/><rect class="box accent" x="660" y="232" width="300" height="26" rx="13"/><text class="ts chipt accentt" x="810.0" y="249" text-anchor="middle">PENDING_SETTLEMENT · difference = pending</text><rect class="box ok" x="660" y="270" width="300" height="26" rx="13"/><text class="ts chipt okt" x="810.0" y="287" text-anchor="middle">MATCHED · no difference, nothing pending</text><rect class="box warn" x="660" y="308" width="300" height="26" rx="13"/><text class="ts chipt warnt" x="810.0" y="325" text-anchor="middle">QUANTITY_BREAK · any other difference</text><rect class="box warn" x="660" y="346" width="300" height="26" rx="13"/><text class="ts chipt warnt" x="810.0" y="363" text-anchor="middle">RECONCILIATION_UNAVAILABLE · custody missing</text><g><rect class="lbg" x="165.8" y="141.0" width="28.3" height="16" rx="3"/><text class="lbl t" x="180.0" y="153.0" text-anchor="middle">yes</text></g><g><rect class="lbg" x="165.8" y="215.0" width="28.3" height="16" rx="3"/><text class="lbl t" x="180.0" y="227.0" text-anchor="middle">yes</text></g><g><rect class="lbg" x="165.8" y="289.0" width="28.3" height="16" rx="3"/><text class="lbl t" x="180.0" y="301.0" text-anchor="middle">yes</text></g><g><rect class="lbg" x="140.8" y="457.0" width="28.3" height="16" rx="3"/><text class="lbl t" x="155.0" y="469.0" text-anchor="middle">yes</text></g><g><rect class="lbg" x="333.9" y="104.0" width="22.2" height="16" rx="3"/><text class="lbl t" x="345.0" y="116.0" text-anchor="middle">no</text></g><g><rect class="lbg" x="333.9" y="178.0" width="22.2" height="16" rx="3"/><text class="lbl t" x="345.0" y="190.0" text-anchor="middle">no</text></g><g><rect class="lbg" x="333.9" y="252.0" width="22.2" height="16" rx="3"/><text class="lbl t" x="345.0" y="264.0" text-anchor="middle">no</text></g><g transform="rotate(-90 600 330)"><rect class="lbg" x="537.0" y="322.0" width="125.9" height="16" rx="3"/><text class="lbl" x="600.0" y="334.0" text-anchor="middle">marks the household</text></g><g><rect class="lbg" x="348.9" y="410.0" width="22.2" height="16" rx="3"/><text class="lbl t" x="360.0" y="422.0" text-anchor="middle">no</text></g><text class="tt" x="660.0" y="66.0" text-anchor="start">Account A · security X · Sep 30</text><text class="ts" x="660.0" y="94.0" text-anchor="start">PAS trade-date quantity</text><text class="ts mono strong" x="960.0" y="94.0" text-anchor="end">1,200</text><text class="ts" x="660.0" y="142.0" text-anchor="start">Custody settled quantity</text><text class="ts mono strong" x="960.0" y="142.0" text-anchor="end">1,000</text><text class="ts" x="660.0" y="188.0" text-anchor="start">pending buy +200, settles Oct 1</text><text class="ts mono strong" x="660.0" y="214.0" text-anchor="start">1,200 − 1,000 = 200 = pending</text><text class="ts" x="660.0" y="404.0" text-anchor="start">Cash uses the same test: CASH_BREAK.</text><text class="ts" x="660.0" y="428.0" text-anchor="start">Breaks are warnings. PAS stays</text><text class="ts" x="660.0" y="446.0" text-anchor="start">authoritative; the agent must disclose them.</text><text class="ts" x="660.0" y="482.0" text-anchor="start">Pending = ACTIVE trades with</text><text class="ts mono" x="660.0" y="500.0" text-anchor="start">trade_date ≤ valuation_date &lt; settle_date</text><text class="ts mono" x="660.0" y="518.0" text-anchor="start">and recorded_at ≤ known_as_of</text><text class="ts" x="660.0" y="560.0" text-anchor="start">Bars to scale: 1 px = 5 shares</text></svg>
