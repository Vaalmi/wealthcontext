xt-anchor="start">family&#x27;s assets.”</text><text class="zl" x="600.0" y="270.0" text-anchor="start">WHAT WENT WRONG</text><circle class="badge deny" cx="612" cy="292" r="9"/><text class="badget" x="612" y="296" text-anchor="middle">1</text><text class="bt" x="630" y="296" text-anchor="start">used a price four business days old</text><circle class="badge deny" cx="612" cy="320" r="9"/><text class="badget" x="612" y="324" text-anchor="middle">2</text><text class="bt" x="630" y="324" text-anchor="start">counted an account that left the family</text><circle class="badge deny" cx="612" cy="348" r="9"/><text class="badget" x="612" y="352" text-anchor="middle">3</text><text class="bt" x="630" y="352" text-anchor="start">picked one of two share counts</text><circle class="badge deny" cx="612" cy="376" r="9"/><text class="badget" x="612" y="380" text-anchor="middle">4</text><text class="bt" x="630" y="380" text-anchor="start">gave no warning about any of it</text><text class="ts" x="20.0" y="436.0" text-anchor="start">Illustrative example with synthetic data.</text></svg>
