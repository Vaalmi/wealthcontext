isor · ops · compliance</text><text class="ts" x="175.0" y="85.5" text-anchor="middle">answers verified before display</text><rect class="box " x="310" y="30" width="230" height="72" rx="7"/><text class="tt t" x="425.0" y="54.5" text-anchor="middle">Claude Desktop / Claude Code</text><text class="ts" x="425.0" y="70.5" text-anchor="middle">an advisor&#x27;s own agent</text><text class="ts" x="425.0" y="85.5" text-anchor="middle">host model writes the prose</text><rect class="box " x="560" y="30" width="230" height="72" rx="7"/><text class="tt t" x="675.0" y="54.5" text-anchor="middle">REST / OpenAPI clients</text><text class="ts" x="675.0" y="70.5" text-anchor="middle">platform engineers</text><text class="ts" x="675.0" y="85.5" text-anchor="middle">other agent apps</text><rect class="box accent" x="60" y="166" width="730" height="58" rx="7"/><text class="tt accentt" x="425.0" y="191.0" text-anchor="middle">Authorization gateway</text><text class="ts" x="425.0" y="207.0" text-anchor="middle">verify JWT → OPA decides before protected data is looked up</text><rect class="box " x="60" y="256" width="730" height="58" rx="7"/><text class="tt t" x="425.0" y="281.0" text-anchor="middle">Context service</text><text class="ts" x="425.0" y="297.0" text-anchor="middle">7 read-only tools · envelope: status, flags, provenance, trace_id</text><rect class="box " x="60" y="346" width="730" height="58" rx="7"/><text class="tt t" x="425.0" y="371.0" text-anchor="middle">Metric registry + Decimal engine</text><text class="ts" x="425.0" y="387.0" text-anchor="middle">market value · household assets · issuer exposure · concentration</text><rect class="box " x="60" y="436" width="730" height="58" rx="7"/><text class="tt t" x="425.0" y="461.0" text-anchor="middle">Canonical store (SQLite, append-only)</text><text class="ts" x="425.0" y="477.0" text-anchor="middle">versioned facts · crosswalk · conflicts · entitlement facts · audit</text><rect class="box " x="60" y="526" width="730" height