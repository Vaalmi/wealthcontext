plain</text></g><g><rect class="lbg" x="429.1" y="133.0" width="241.8" height="16" rx="3"/><text class="lbl accentt" x="550.0" y="145.0" text-anchor="middle">Platform owns facts, permissions, math</text></g><g><rect class="lbg" x="343.8" y="148.0" width="162.5" height="16" rx="3"/><text class="lbl" x="425.0" y="160.0" text-anchor="middle">tool calls + bearer token</text></g><g><rect class="lbg" x="346.8" y="232.0" width="156.4" height="16" rx="3"/><text class="lbl accentt" x="425.0" y="244.0" text-anchor="middle">allowed IDs + projection</text></g><g><rect class="lbg" x="343.8" y="322.0" width="162.5" height="16" rx="3"/><text class="lbl t" x="425.0" y="334.0" text-anchor="middle">compute at valuation_date</text></g><g><rect class="lbg" x="365.1" y="412.0" width="119.8" height="16" rx="3"/><text class="lbl t" x="425.0" y="424.0" text-anchor="middle">point-in-time read</text></g><g><rect class="lbg" x="203.2" y="502.0" width="113.7" height="16" rx="3"/><text class="lbl t" x="260.0" y="514.0" text-anchor="middle">atomic run commit</text></g><g><rect class="lbg" x="89.2" y="592.0" width="113.7" height="16" rx="3"/><text class="lbl t" x="146.0" y="604.0" text-anchor="middle">files + manifests</text></g><g transform="rotate(-90 40 330)"><rect class="lbg" x="-50.4" y="322.0" width="180.8" height="16" rx="3"/><text class="lbl accentt" x="40.0" y="334.0" text-anchor="middle">entitlement facts @ revision</text></g></svg>
