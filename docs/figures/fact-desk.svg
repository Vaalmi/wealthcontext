<svg class="dg" viewBox="-14 -14 1028 458" width="1028" height="458" role="img" aria-label="Before and after. Without a fact desk the AI reads all three systems directly, guesses which is right, does its own math, can see every family and keeps no record. With WealthContext in the middle, the AI asks WealthContext and gets checked facts; WealthContext checks permission, uses the official record, does the math with fixed rules and keeps receipts." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg:#F2F4F3;--panel:#FBFCFB;--surface:#FFFFFF;--surface-2:#E9ECEB;--zone:#F4F6F5;--fg:#18202B;--fg-muted:#566070;--line:#CDD3D6;--line-strong:#7B8592;--edge:#46505E;--accent:#2756A6;--accent-soft:#E2EAF7;--ok:#1F7A4D;--ok-soft:#DFF1E7;--warn:#9C5B0E;--warn-soft:#FAEBD5;--deny:#B02A22;--deny-soft:#F8E1DF;--display:Georgia, "Times New Roman", serif;--body:"IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;--mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}
