<svg class="dg" viewBox="-14 -14 1028 318" width="1028" height="318" role="img" aria-label="An answer says Northwind Rail is the Chen family&#x27;s largest holding at $1,239,000, 18.6% of their assets. $1,239,000 traces to 12,000 shares across 3 accounts and a $103.25 closing price; 18.6% traces to the written concentration rule; both trace to the source files and their arrival times." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg:#F2F4F3;--panel:#FBFCFB;--surface:#FFFFFF;--surface-2:#E9ECEB;--zone:#F4F6F5;--fg:#18202B;--fg-muted:#566070;--line:#CDD3D6;--line-strong:#7B8592;--edge:#46505E;--accent:#2756A6;--accent-soft:#E2EAF7;--ok:#1F7A4D;--ok-soft:#DFF1E7;--warn:#9C5B0E;--warn-soft:#FAEBD5;--deny:#B02A22;--deny-soft:#F8E1DF;--display:Georgia, "Times New Roman", serif;--body:"IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;--mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}
