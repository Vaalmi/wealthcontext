text-anchor="middle">Ask</text><text class="ts" x="100.0" y="128.0" text-anchor="middle">an advisor types a</text><text class="ts" x="100.0" y="145.0" text-anchor="middle">question in plain English</text><text class="stepn accentt" x="300" y="63" text-anchor="middle">2</text><text class="tt14" x="300.0" y="108.0" text-anchor="middle">Check permission</text><text class="ts" x="300.0" y="128.0" text-anchor="middle">is this advisor allowed</text><text class="ts" x="300.0" y="145.0" text-anchor="middle">to see this family?</text><text class="stepn t" x="500" y="63" text-anchor="middle">3</text><text class="tt14" x="500.0" y="108.0" text-anchor="middle">Gather official records</text><text class="ts" x="500.0" y="128.0" text-anchor="middle">for the date asked, using</text><text class="ts" x="500.0" y="145.0" text-anchor="middle">the agreed source per fact</text><text class="stepn t" x="700" y="63" text-anchor="middle">4</text><text class="tt14" x="700.0" y="108.0" text-anchor="middle">Calculate</text><text class="ts" x="700.0" y="128.0" text-anchor="middle">with fixed, written rules,</text><text class="ts" x="700.0" y="145.0" text-anchor="middle">never by the AI</text><text class="stepn okt" x="900" y="63" text-anchor="middle">5</text><text class="tt14" x="900.0" y="108.0" text-anchor="middle">Answer with warnings</text><text class="ts" x="900.0" y="128.0" text-anchor="middle">figures carry their</text><text class="ts" x="900.0" y="145.0" text-anchor="middle">sources and any warnings</text><g><rect class="lbg" x="288.9" y="179.5" width="22.2" height="16" rx="3"/><text class="lbl t" x="300.0" y="191.5" text-anchor="middle">no</text></g><g><rect class="lbg" x="382.1" y="179.5" width="235.7" height="16" rx="3"/><text class="lbl t" x="500.0" y="191.5" text-anchor="middle">if key data is missing or out of date</text></g><g><rect class="lbg" x="689.6" y="236.0" width="180.8" height="16" rx="3"/><text class="lbl t" x="780.0" y="248.0" text-anchor="middle">still answers, with warnings</text></g></svg>
