.dg .edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.dg .edge.accent{stroke:var(--accent)} .dg .edge.ok{stroke:var(--ok)} .dg .edge.deny{stroke:var(--deny)} .dg .edge.warn{stroke:var(--warn)}
.dg .edge.dash{stroke-dasharray:5 4}
