.dg .hl{fill:var(--accent);font-weight:700}
.dg .person{fill:var(--line-strong)}
.dg .bubble{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.1}
.dg .bubble.soft{fill:var(--surface-2);stroke:none}
.dg .bubble.deny{fill:var(--deny-soft);stroke:var(--deny)}
.dg .bubble.accent{fill:var(--accent-soft);stroke:var(--accent)}
.dg .badge{fill:var(--deny)}
.dg .badget{font-size:11px;font-weight:700;fill:var(--panel)}
.dg .card{fill:var(--surface);stroke:var(--line)}
.dg .dotc.warn{fill:var(--warn)} .dg .dotc.deny{fill:var(--deny)}
.dg .step{fill:var(--surface);stroke:var(--line-strong);stroke-width:2}
.dg .step.accent{fill:var(--accent-soft);stroke:var(--accent)} .dg .step.ok{fill:var(--ok-soft);stroke:var(--ok)}
.dg .stepn{font-family:var(--display);font-size:19px;font-weight:600;fill:var(--fg)}</style><rect class="panel" x="-13.5" y="-13.5" width="1027" height="407" rx="10"/><defs><marker id="pa-base" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head base"/></marker><marker id="pa-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head deny"/></marker><marker id="pa-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head ok"/></marker></defs><path class="edge ok" d="M 250.0 52.0 L 520.0 52.0" marker-end="url(#pa-ok)"/><path class="edge deny dash" d="M 250.0 70.0 L 380.0 70.0 L 380.0 136.0 L 520.0 136.0" marker-end="url(#pa-deny)"/><path class="edge ok" d="M 250.0 158.0 L 520.0 158.0" marker-end="url(#pa-ok)"/><path class="edge " d="M 250.0 250.0 L 520.0 250.0" marker-end="url(#pa-base)"/><path class="edge " d="M 250.0 330.0 L 520.0 330.0" marker-end="url(#pa-base)"/><rect class="box " x="20" y="30" width="230" height="60" rx="7"/><circle class="person " cx="50" cy="52" r="9"/><path class="person " d="M 35 78 Q 35 64 50 64 Q 65 64 65 78 Z"/><rect class="box " x="20" y="120" width="230" height="60" rx="7"/><circle class="person " cx="50" cy="142" r="9"/><path class="person " d="M 35 168 Q 35 154 50 154 Q 65 154 65 168 Z"/><rect class="box " x="20" y="220" width="230" height="60" rx="7"/><circle class="person " cx="50" cy="242" r="9"/><path class="person " d="M 35 268 Q 35 254 50 254 Q 65 254 65 268 Z"/><rect class="box " x="20" y="300" width="230" height="60" rx="7"/><circle class="person " cx="50" cy="322" r="9"/><path class="person " d="M 35 348 Q 35 334 50 334 Q 65 334 65 348 Z"/><rect class="box " x="520" y="26" width="210" height="56" rx="7"/><text class="tt t" x="625.0" y="50.0" text-anchor="middle">Chen family</text><text class="ts" x="625.0" y="66.0" text-anchor="middle">looked after by Priya</text><rect class="box " x="520" y="120" width="210" height="56" rx="7"/><text class="tt t" x="625.0" y="144.0" text-anchor="middle">Okafor family</text><text class="ts" x="625.0" y="160.0" text-anchor="middle">moved to Marcus on Oct 1</text><rect class="box muted" x="520" y="222" width="210" height="56" rx="7"/><text class="tt mutedt" x="625.0" y="246.0" text-anchor="middle">Data-quality reports</text><text class="ts" x="625.0" y="262.0" text-anchor="middle">every family, names hidden</text><rect class="box muted" x="520" y="302" width="210" height="56" rx="7"/><text class="tt mutedt" x="625.0" y="326.0" text-anchor="middle">Audit trail and sources</text><text class="ts" x="625.0" y="342.0" text-anchor="middle">who saw what; where figures came from</text><rect class="box accent" x="770" y="26" width="210" height="170" rx="7"/><text class="tt accentt" x="875.0" y="77.0" text-anchor="middle">How it&#x27;s decided</text><text class="ts" x="875.0" y="93.0" text-anchor="middle">checked on each data request</text><text class="ts" x="875.0" y="108.0" text-anchor="middle">uses today&#x27;s assignments,</text><text class="ts" x="875.0" y="123.0" text-anchor="middle">even for past dates</text><text class="ts" x="875.0" y="138.0" text-anchor="middle">a former advisor is refused</text><text class="ts" x="875.0" y="153.0" text-anchor="middle">every decision is logged</text><text class="tt" x="80.0" y="57.0" text-anchor="start">Priya</text><text class="ts" x="80.0" y="75.0" text-anchor="start">advisor</text><text class="tt" x="80.0" y="147.0" text-anchor="start">Marcus</text><text class="ts" x="80.0" y="165.0" text-anchor="start">advisor</text><text class="tt" x="80.0" y="247.0" text-anchor="start">Operations</text><text class="ts" x="80.0" y="265.0" text-anchor="start">investigates data problems</text><text class="tt" x="80.0" y="327.0" text-anchor="start">Compliance</text><text class="ts" x="80.0" y="345.0" text-anchor="start">reviews access</text><g><rect class="lbg" x="361.7" y="44.0" width="46.6" height="16" rx="3"/><text class="lbl okt" x="385.0" y="56.0" text-anchor="middle">covers</text></g><g><rect class="lbg" x="411.4" y="128.0" width="77.1" height="16" rx="3"/><text class="lbl denyt" x="450.0" y="140.0" text-anchor="middle">ended Oct 1</text></g><g><rect class="lbg" x="349.5" y="150.0" width="71.0" height="16" rx="3"/><text class="lbl okt" x="385.0" y="162.0" text-anchor="middle">from Oct 1</text></g><g><rect class="lbg" x="312.9" y="242.0" width="144.2" height="16" rx="3"/><text class="lbl t" x="385.0" y="254.0" text-anchor="middle">all families, no names</text></g><g><rect class="lbg" x="352.6" y="322.0" width="64.9" height="16" rx="3"/><text class="lbl t" x="385.0" y="334.0" text-anchor="middle">read-only</text></g></svg>
