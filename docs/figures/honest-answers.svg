<svg class="dg" viewBox="-14 -14 1028 448" width="1028" height="448" role="img" aria-label="Four example replies. Old price: the assistant confirms part of the total and won&#x27;t give a current total. Systems disagree: it uses the client records as the official source and flags the difference. Failed delivery: it marks the total incomplete. No longer the family&#x27;s advisor: it refuses, and the attempt is logged." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg:#F2F4F3;--panel:#FBFCFB;--surface:#FFFFFF;--surface-2:#E9ECEB;--zone:#F4F6F5;--fg:#18202B;--fg-muted:#566070;--line:#CDD3D6;--line-strong:#7B8592;--edge:#46505E;--accent:#2756A6;--accent-soft:#E2EAF7;--ok:#1F7A4D;--ok-soft:#DFF1E7;--warn:#9C5B0E;--warn-soft:#FAEBD5;--deny:#B02A22;--deny-soft:#F8E1DF;--display:Georgia, "Times New Roman", serif;--body:"IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;--mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){svg{--bg:#11161C;--panel:#161C23;--surface:#1D242D;--surface-2:#252D38;--zone:#192028;--fg:#E5E9EE;--fg-muted:#9AA4B1;--line:#323B47;--line-strong:#6A7584;--edge:#A9B2BF;--accent:#8EB2F2;--accent-soft:#1D2C47;--ok:#6FCB9A;--ok-soft:#163325;--warn:#E8B062;--warn-soft:#382813;--deny:#F28B83;--deny-soft:#3B1C1A;}}
.panel{fill:var(--panel);stroke:var(--line)}
.dg text{font-family:var(--body)}
.dg .tt{font-size:13px;font-weight:600;fill:var(--fg)}
.dg .ts{font-size:11.5px;fill:var(--fg-muted)}
.dg .lbl{font-size:11px;fill:var(--fg-muted)}
.dg .mono{font-family:var(--mono)}
.dg .tt.mono{font-size:12.5px}
.dg .strong{fill:var(--fg);font-weight:600}
.dg .big{font-family:var(--display);font-size:22px;font-weight:600;fill:var(--fg)}
.dg .axt{fill:var(--fg);font-weight:500}
.dg .zl{font-size:10.5px;letter-spacing:.08em;font-weight:600;fill:var(--fg-muted)}
.dg .chipt{font-size:11.5px;font-weight:600}
.dg .accentt{fill:var(--accent)} .dg .okt{fill:var(--ok)} .dg .warnt{fill:var(--warn)} .dg .denyt{fill:var(--deny)}
.dg .lbg{fill:var(--panel)}
.dg .zone{fill:var(--zone);stroke:var(--line);stroke-dasharray:5 4}
.dg .box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.1}
.dg .box.q{stroke-width:1.6}
.dg .box.accent{fill:var(--accent-soft);stroke:var(--accent)}
.dg .box.ok{fill:var(--ok-soft);stroke:var(--ok)}
.dg .box.warn{fill:var(--warn-soft);stroke:var(--warn)}
.dg .box.deny{fill:var(--deny-soft);stroke:var(--deny)}
.dg .box.muted{fill:var(--surface-2);stroke:var(--line)}
.dg .box.ghost{fill:none;stroke:var(--line-strong);stroke-dasharray:6 4}
.dg .edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.dg .edge.accent{stroke:var(--accent)} .dg .edge.ok{stroke:var(--ok)} .dg .edge.deny{stroke:var(--deny)} .dg .edge.warn{stroke:var(--warn)}
.dg .edge.dash{stroke-dasharray:5 4}
.dg .edge.divider{stroke:var(--accent);stroke-dasharray:2 4;stroke-width:1.6}
.dg .edge.guide{stroke:var(--fg-muted);stroke-dasharray:4 4;stroke-width:1.1}
.dg .edge.guide.accent{stroke:var(--accent)}
.dg .edge.life{stroke:var(--line-strong);stroke-dasharray:3 5;stroke-width:1}
.dg .edge.axis{stroke:var(--fg-muted);stroke-width:1}
.dg .head{fill:var(--edge)} .dg .head.accent{fill:var(--accent)} .dg .head.ok{fill:var(--ok)} .dg .head.deny{fill:var(--deny)} .dg .head.warn{fill:var(--warn)}
.dg .reg0{fill:var(--surface-2)} .dg .reg1{fill:var(--surface)} .dg .reg2{fill:var(--accent-soft)}
.dg .plotframe{fill:none;stroke:var(--line-strong)}
.dg .dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.dg .bar{fill:var(--line-strong)} .dg .bar.accent{fill:var(--accent)}
.dg .bar.pending{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:3 3}
.dg .bar.ghost{fill:none;stroke:var(--line-strong);stroke-dasharray:5 4}
.dg .tt14{font-size:14px;font-weight:600;fill:var(--fg)}
.dg .bt{font-size:13.5px;fill:var(--fg)}
.dg .bq{font-size:15.5px;font-weight:500;fill:var(--fg)}
.dg .hl{fill:var(--accent);font-weight:700}
.dg .person{fill:var(--line-strong)}
.dg .bubble{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.1}
.dg .bubble.soft{fill:var(--surface-2);stroke:none}
.dg .bubble.deny{fill:var(--deny-soft);stroke:var(--deny)}
.dg .bubble.accent{fill:var(--accent-soft);stroke:var(--accent)}
.dg .badge{fill:var(--deny)}
.dg .badget{font-size:11px;font-weight:700;fill:var(--panel)}
.dg .card{fill:var(--surface);stroke:var(--line)}
.dg .dotc.warn{fill:var(--warn)} .dg .dotc.deny{fill:var(--deny)}
.dg .step{fill:var(--surface);stroke:var(--line-strong);stroke-width:2}
.dg .step.accent{fill:var(--accent-soft);stroke:var(--accent)} .dg .step.ok{fill:var(--ok-soft);stroke:var(--ok)}
.dg .stepn{font-family:var(--display);font-size:19px;font-weight:600;fill:var(--fg)}</style><rect class="panel" x="-13.5" y="-13.5" width="1027" height="447" rx="10"/><defs></defs><rect class="card" x="20" y="20" width="470" height="180" rx="12"/><circle class="dotc warn" cx="44" cy="47" r="5"/><rect class="bubble soft" x="36" y="66" width="438" height="96" rx="14"/><rect class="card" x="510" y="20" width="470" height="180" rx="12"/><circle class="dotc warn" cx="534" cy="47" r="5"/><rect class="bubble soft" x="526" y="66" width="438" height="96" rx="14"/><rect class="card" x="20" y="220" width="470" height="180" rx="12"/><circle class="dotc warn" cx="44" cy="247" r="5"/><rect class="bubble soft" x="36" y="266" width="438" height="96" rx="14"/><rect class="card" x="510" y="220" width="470" height="180" rx="12"/><circle class="dotc deny" cx="534" cy="247" r="5"/><rect class="bubble soft" x="526" y="266" width="438" height="96" rx="14"/><text class="tt" x="58.0" y="52.0" text-anchor="start">A price is four business days old</text><text class="bt" x="52" y="94" text-anchor="start">“I can confirm $3.92M of the Okafor family&#x27;s</text><text class="bt" x="52" y="112" text-anchor="start">assets. One holding&#x27;s latest price is from</text><text class="bt" x="52" y="130" text-anchor="start">Sep 24, so I won&#x27;t give a Sep 30 total.”</text><text class="ts" x="40.0" y="184.0" text-anchor="start">Warning attached: stale price</text><text class="tt" x="548.0" y="52.0" text-anchor="start">Two systems disagree about the family</text><text class="bt" x="542" y="94" text-anchor="start">“The client records, our official source,</text><text class="bt" x="542" y="112" text-anchor="start">show Daniel Okafor left the household on</text><text class="bt" x="542" y="130" text-anchor="start">Aug 15. Accounting still lists him; it&#x27;s flagged.”</text><text class="ts" x="530.0" y="184.0" text-anchor="start">Warning attached: household records disagree</text><text class="tt" x="58.0" y="252.0" text-anchor="start">A data delivery failed</text><text class="bt" x="52" y="294" text-anchor="start">“Today&#x27;s accounting file for two of the</text><text class="bt" x="52" y="312" text-anchor="start">family&#x27;s accounts didn&#x27;t arrive. I can show</text><text class="bt" x="52" y="330" text-anchor="start">confirmed amounts, but no household total.”</text><text class="ts" x="40.0" y="384.0" text-anchor="start">Warning attached: source file missing</text><text class="tt" x="548.0" y="252.0" text-anchor="start">The advisor no longer looks after this family</text><text class="bt" x="542" y="294" text-anchor="start">“You&#x27;re not authorized to view this household.”</text><text class="ts" x="530.0" y="384.0" text-anchor="start">Recorded in the access log for compliance</text></svg>
