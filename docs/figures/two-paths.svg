<svg class="dg" viewBox="-14 -14 1028 498" width="1028" height="498" role="img" aria-label="Comparison: both paths receive the same governed envelope. The workbench path adds a verifier and renderer; the Claude Desktop path has no verifier, only guidelines, and the host writes its own prose." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg:#F2F4F3;--panel:#FBFCFB;--surface:#FFFFFF;--surface-2:#E9ECEB;--zone:#F4F6F5;--fg:#18202B;--fg-muted:#566070;--line:#CDD3D6;--line-strong:#7B8592;--edge:#46505E;--accent:#2756A6;--accent-soft:#E2EAF7;--ok:#1F7A4D;--ok-soft:#DFF1E7;--warn:#9C5B0E;--warn-soft:#FAEBD5;--deny:#B02A22;--deny-soft:#F8E1DF;--display:Georgia, "Times New Roman", serif;--body:"IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;--mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){svg{--bg:#11161C;--panel:#161C23;--surface:#1D242D;--surface-2:#252D38;--zone:#192028;--fg:#E5E9EE;--fg-muted:#9AA4B1;--line:#323B47;--line-strong:#6A7584;--edge:#A9B2BF;--accent:#8EB2F2;--accent-soft:#1D2C47;--ok:#6FCB9A;--ok-soft:#163325;--warn:#E8B062;--warn-soft:#382813;--deny:#F28B83;--deny-soft:#3B1C1A;}}
.panel{fill:var(--panel);stroke:var(--line)}
.dg text{font-family:var(--body)}
.dg .tt{font-size:13px;font-weight:600;fill:var(--fg)}
.dg .ts{font-size:11.5px;fill:var(--fg-muted)}
.dg .lbl{font-size:11px;fill:var(--fg-muted)}
.dg .mono{font-family:var(--mono)}
.dg .tt.mono{font-size:12.5px}
.dg .strong{fill:var(--fg);font-weight:600}
.dg .big{font-family:var(--display);font-size:22px;font-weight:600;fill:var(--fg)}
.dg .axt{fill:var(--fg);font-weight:500}
.dg .zl{font-size:10.5px;letter-spacing:.08em;font-weight:600;fill:var(--fg-muted)}
.dg .chipt{font-size:11.5px;font-weight:600}
.dg .accentt{fill:var(--accent)} .dg .okt{fill:var(--ok)} .dg .warnt{fill:var(--warn)} .dg .denyt{fill:var(--deny)}
.dg .lbg{fill:var(--panel)}
.dg .zone{fill:var(--zone);stroke:var(--line);stroke-dasharray:5 4}
.dg .box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.1}
.dg .box.q{stroke-width:1.6}
.dg .box.accent{fill:var(--accent-soft);stroke:var(--accent)}
.dg .box.ok{fill:var(--ok-soft);stroke:var(--ok)}
.dg .box.warn{fill:var(--warn-soft);stroke:var(--warn)}
.dg .box.deny{fill:var(--deny-soft);stroke:var(--deny)}
.dg .box.muted{fill:var(--surface-2);stroke:var(--line)}
.dg .box.ghost{fill:none;stroke:var(--line-strong);stroke-dasharray:6 4}
.dg .edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.dg .edge.accent{stroke:var(--accent)} .dg .edge.ok{stroke:var(--ok)} .dg .edge.deny{stroke:var(--deny)} .dg .edge.warn{stroke:var(--warn)}
.dg .edge.dash{stroke-dasharray:5 4}
.dg .edge.divider{stroke:var(--accent);stroke-dasharray:2 4;stroke-width:1.6}
.dg .edge.guide{stroke:var(--fg-muted);stroke-dasharray:4 4;stroke-width:1.1}
.dg .edge.guide.accent{stroke:var(--accent)}
.dg .edge.life{stroke:var(--line-strong);stroke-dasharray:3 5;stroke-width:1}
.dg .edge.axis{stroke:var(--fg-muted);stroke-width:1}
.dg .head{fill:var(--edge)} .dg .head.accent{fill:var(--accent)} .dg .head.ok{fill:var(--ok)} .dg .head.deny{fill:var(--deny)} .dg .head.warn{fill:var(--warn)}
.dg .reg0{fill:var(--surface-2)} .dg .reg1{fill:var(--surface)} .dg .reg2{fill:var(--accent-soft)}
.dg .plotframe{fill:none;stroke:var(--line-strong)}
.dg .dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.dg .bar{fill:var(--line-strong)} .dg .bar.accent{fill:var(--accent)}
.dg .bar.pending{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:3 3}
.dg .bar.ghost{fill:none;stroke:var(--line-strong);stroke-dasharray:5 4}
.dg .tt14{font-size:14px;font-weight:600;fill:var(--fg)}
.dg .bt{font-size:13.5px;fill:var(--fg)}
.dg .bq{font-size:15.5px;font-weight:500;fill:var(--fg)}
.dg .hl{fill:var(--accent);font-weight:700}
.dg .person{fill:var(--line-strong)}
.dg .bubble{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.1}
.dg .bubble.soft{fill:var(--surface-2);stroke:none}
.dg .bubble.deny{fill:var(--deny-soft);stroke:var(--deny)}
.dg .bubble.accent{fill:var(--accent-soft);stroke:var(--accent)}
.dg .badge{fill:var(--deny)}
.dg .badget{font-size:11px;font-weight:700;fill:var(--panel)}
.dg .card{fill:var(--surface);stroke:var(--line)}
.dg .dotc.warn{fill:var(--warn)} .dg .dotc.deny{fill:var(--deny)}
.dg .step{fill:var(--surface);stroke:var(--line-strong);stroke-width:2}
.dg .step.accent{fill:var(--accent-soft);stroke:var(--accent)} .dg .step.ok{fill:var(--ok-soft);stroke:var(--ok)}
.dg .stepn{font-family:var(--display);font-size:19px;font-weight:600;fill:var(--fg)}</style><rect class="panel" x="-13.5" y="-13.5" width="1027" height="497" rx="10"/><defs><marker id="path-base" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head base"/></marker></defs><rect class="zone" x="20" y="120" width="470" height="334" rx="12"/><text class="zl" x="34" y="140">WEALTHCONTEXT WORKBENCH AND EVAL</text><rect class="zone" x="510" y="120" width="470" height="334" rx="12"/><text class="zl" x="524" y="140">CLAUDE DESKTOP / CLAUDE CODE</text><path class="edge " d="M 420.0 92.0 L 420.0 108.0 L 255.0 108.0 L 255.0 150.0" marker-end="url(#path-base)"/><path class="edge " d="M 580.0 92.0 L 580.0 108.0 L 745.0 108.0 L 745.0 150.0" marker-end="url(#path-base)"/><path class="edge " d="M 255.0 202.0 L 255.0 226.0" marker-end="url(#path-base)"/><path class="edge " d="M 255.0 292.0 L 255.0 316.0" marker-end="url(#path-base)"/><path class="edge " d="M 255.0 368.0 L 255.0 392.0" marker-end="url(#path-base)"/><path class="edge  dash" d="M 745.0 202.0 L 745.0 226.0" marker-end="url(#path-base)"/><path class="edge  dash" d="M 745.0 292.0 L 745.0 316.0" marker-end="url(#path-base)"/><path class="edge  dash" d="M 745.0 368.0 L 745.0 392.0" marker-end="url(#path-base)"/><rect class="box accent" x="330" y="20" width="340" height="72" rx="7"/><text class="tt accentt" x="500.0" y="44.5" text-anchor="middle">One governed envelope</text><text class="ts" x="500.0" y="60.5" text-anchor="middle">same tools · same OPA checks</text><text class="ts" x="500.0" y="75.5" text-anchor="middle">status · flags · provenance · trace_id</text><rect class="box " x="60" y="150" width="390" height="52" rx="7"/><text class="tt t" x="255.0" y="172.0" text-anchor="middle">Model submits a draft</text><text class="ts" x="255.0" y="188.0" text-anchor="middle">submit_answer with {{c1}} and {{p1}} placeholders</text><rect class="box accent" x="60" y="226" width="390" height="66" rx="7"/><text class="tt accentt" x="255.0" y="247.5" text-anchor="middle">Verifier</text><text class="ts" x="255.0" y="263.5" text-anchor="middle">claims resolve to authorized results</text><text class="ts" x="255.0" y="278.5" text-anchor="middle">every warning disclosed · no stray numbers · lint</text><rect class="box " x="60" y="316" width="390" height="52" rx="7"/><text class="tt t" x="255.0" y="338.0" text-anchor="middle">Renderer</text><text class="ts" x="255.0" y="354.0" text-anchor="middle">fills numbers and words like &quot;largest&quot; from data</text><rect class="box ok" x="60" y="392" width="390" height="52" rx="7"/><text class="tt okt" x="255.0" y="414.0" text-anchor="middle">Verified answer + caveat callouts</text><text class="ts" x="255.0" y="430.0" text-anchor="middle">fails twice → deterministic fallback</text><rect class="box " x="550" y="150" width="390" height="52" rx="7"/><text class="tt t" x="745.0" y="172.0" text-anchor="middle">Host model reads the envelope</text><text class="ts" x="745.0" y="188.0" text-anchor="middle">guided by server instructions or the prompt</text><rect class="box ghost" x="550" y="226" width="390" height="66" rx="7"/><text class="tt ghostt" x="745.0" y="247.5" text-anchor="middle">No verifier on this path</text><text class="ts" x="745.0" y="263.5" text-anchor="middle">WealthContext cannot check host prose</text><text class="ts" x="745.0" y="278.5" text-anchor="middle">guidelines ask: quote exactly, cite trace_id, list flags</text><rect class="box " x="550" y="316" width="390" height="52" rx="7"/><text class="tt t" x="745.0" y="338.0" text-anchor="middle">Host writes its own prose</text><text class="ts" x="745.0" y="354.0" text-anchor="middle">host support varies; guidelines are not enforced</text><rect class="box muted" x="550" y="392" width="390" height="52" rx="7"/><text class="tt mutedt" x="745.0" y="414.0" text-anchor="middle">Answer in Claude</text><text class="ts" x="745.0" y="430.0" text-anchor="middle">figures should carry trace IDs</text></svg>
