<svg class="dg" viewBox="-14 -14 1028 364" width="1028" height="364" role="img" aria-label="Timeline: a purchase of 200 shares happens Sep 29; the quarter ends Sep 30; on Oct 3 the advisor sees 1,000 shares; on Oct 6 the purchase reaches the books; today the quarter-end shows 1,200 shares. WealthContext can answer both what was known on Oct 3 and what is true for quarter-end today." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg:#F2F4F3;--panel:#FBFCFB;--surface:#FFFFFF;--surface-2:#E9ECEB;--zone:#F4F6F5;--fg:#18202B;--fg-muted:#566070;--line:#CDD3D6;--line-strong:#7B8592;--edge:#46505E;--accent:#2756A6;--accent-soft:#E2EAF7;--ok:#1F7A4D;--ok-soft:#DFF1E7;--warn:#9C5B0E;--warn-soft:#FAEBD5;--deny:#B02A22;--deny-soft:#F8E1DF;--display:Georgia, "Times New Roman", serif;--body:"IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;--mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}
