<svg class="dg" viewBox="-14 -14 1028 468" width="1028" height="468" role="img" aria-label="Ingestion: five feeds with manifests go through manifest check, schema validation, account-atomic quarantine, idempotent append and an atomic run commit into the canonical store; side outputs are the feed-run log, quarantine and the entitlement revision." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg:#F2F4F3;--panel:#FBFCFB;--surface:#FFFFFF;--surface-2:#E9ECEB;--zone:#F4F6F5;--fg:#18202B;--fg-muted:#566070;--line:#CDD3D6;--line-strong:#7B8592;--edge:#46505E;--accent:#2756A6;--accent-soft:#E2EAF7;--ok:#1F7A4D;--ok-soft:#DFF1E7;--warn:#9C5B0E;--warn-soft:#FAEBD5;--deny:#B02A22;--deny-soft:#F8E1DF;--display:Georgia, "Times New Roman", serif;--body:"IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;--mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){svg{--bg:#11161C;--panel:#161C23;--surface:#1D242D;--surface-2:#252D38;--zone:#192028;--fg:#E5E9EE;--fg-muted:#9AA4B1;--line:#323B47;--line-strong:#6A7584;--edge:#A9B2BF;--accent:#8EB2F2;--accent-soft:#1D2C47;--ok:#6FCB9A;--ok-soft:#163325;--warn:#E8B062;--warn-soft:#382813;--deny:#F28B83;--deny-soft:#3B1C1A;}}
.panel{fill:var(--panel);stroke:var(--line)}
.dg text{font-family:var(--body)}
.dg .tt{font-size:13px;font-weight:600;fill:var(--fg)}
