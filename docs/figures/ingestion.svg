.dg .dotc.warn{fill:var(--warn)} .dg .dotc.deny{fill:var(--deny)}
.dg .step{fill:var(--surface);stroke:var(--line-strong);stroke-width:2}
.dg .step.accent{fill:var(--accent-soft);stroke:var(--accent)} .dg .step.ok{fill:var(--ok-soft);stroke:var(--ok)}
.dg .stepn{font-family:var(--display);font-size:19px;font-weight:600;fill:var(--fg)}</style><rect class="panel" x="-13.5" y="-13.5" width="1027" height="467" rx="10"/><defs><marker id="ing-base" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head base"/></marker></defs><path class="edge " d="M 210.0 63.0 L 230.0 63.0"/><path class="edge " d="M 210.0 139.0 L 230.0 139.0"/><path class="edge " d="M 210.0 215.0 L 230.0 215.0"/><path class="edge " d="M 210.0 291.0 L 230.0 291.0"/><path class="edge " d="M 210.0 367.0 L 230.0 367.0"/><path class="edge " d="M 230.0 63.0 L 230.0 367.0"/><path class="edge " d="M 230.0 63.0 L 260.0 63.0" marker-end="url(#ing-base)"/><path class="edge " d="M 375.0 92.0 L 375.0 110.0" marker-end="url(#ing-base)"/><path class="edge " d="M 375.0 168.0 L 375.0 186.0" marker-end="url(#ing-base)"/><path class="edge " d="M 375.0 244.0 L 375.0 262.0" marker-end="url(#ing-base)"/><path class="edge " d="M 375.0 320.0 L 375.0 338.0" marker-end="url(#ing-base)"/><path class="edge " d="M 490.0 63.0 L 540.0 63.0" marker-end="url(#ing-base)"/><path class="edge " d="M 490.0 215.0 L 540.0 215.0" marker-end="url(#ing-base)"/><path class="edge " d="M 490.0 139.0 L 515.0 139.0 L 515.0 200.0 L 540.0 200.0" marker-end="url(#ing-base)"/><path class="edge " d="M 490.0 367.0 L 540.0 367.0" marker-end="url(#ing-base)"/><path class="edge " d="M 770.0 320.0 L 785.0 320.0 L 785.0 258.0 L 800.0 258.0" marker-end="url(#ing-base)"/><path class="edge " d="M 770.0 376.0 L 800.0 376.0" marker-end="url(#ing-base)"/><rect class="box " x="20" y="34" width="190" height="58" rx="7"/><text class="tt t" x="115.0" y="59.0" text-anchor="middle">Custody positions + cash</text><text class="ts" x="115.0" y="75.0" text-anchor="middle">secondary: reconciliation</text><rect class="box " x="20" y="110" width="190" height="58" rx="7"/><text class="tt t" x="115.0" y="135.0" text-anchor="middle">Custody EOD prices</text><text class="ts" x="115.0" y="151.0" text-anchor="middle">authoritative for price</text><rect class="box " x="20" y="186" width="190" height="58" rx="7"/><text class="tt t" x="115.0" y="211.0" text-anchor="middle">CRM</text><text class="ts" x="115.0" y="227.0" text-anchor="middle">people, households, coverage</text><rect class="box " x="20" y="262" width="190" height="58" rx="7"/><text class="tt t" x="115.0" y="287.0" text-anchor="middle">Portfolio accounting</text><text class="ts" x="115.0" y="303.0" text-anchor="middle">authoritative: qty, cash</text><rect class="box " x="20" y="338" width="190" height="58" rx="7"/><text class="tt t" x="115.0" y="363.0" text-anchor="middle">FX fix</text><text class="ts" x="115.0" y="379.0" text-anchor="middle">authoritative for rates</text><rect class="box " x="260" y="34" width="230" height="58" rx="7"/><text class="tt t" x="375.0" y="59.0" text-anchor="middle">1 · Manifest check</text><text class="ts" x="375.0" y="75.0" text-anchor="middle">counts, checksum, expected accounts</text><rect class="box " x="260" y="110" width="230" height="58" rx="7"/><text class="tt t" x="375.0" y="135.0" text-anchor="middle">2 · Schema validation</text><text class="ts" x="375.0" y="151.0" text-anchor="middle">typed model per feed</text><rect class="box " x="260" y="186" width="230" height="58" rx="7"/><text class="tt t" x="375.0" y="211.0" text-anchor="middle">3 · Account-atomic quarantine</text><text class="ts" x="375.0" y="227.0" text-anchor="middle">a cut-off account commits nothing</text><rect class="box " x="260" y="262" width="230" height="58" rx="7"/><text class="tt t" x="375.0" y="287.0" text-anchor="middle">4 · Idempotent append</text><text class="ts" x="375.0" y="303.0" text-anchor="middle">same file or row twice: no-op</text><rect class="box " x="260" y="338" width="230" height="58" rx="7"/><text class="tt t" x="375.0" y="363.0" text-anchor="middle">5 · Atomic run commit</text><text class="ts" x="375.0" y="379.0" text-anchor="middle">every row gets one recorded_at</text><rect class="box muted" x="540" y="34" width="230" height="72" rx="7"/><text class="tt mutedt" x="655.0" y="58.5" text-anchor="middle">Feed-run log</text><text class="ts" x="655.0" y="74.5" text-anchor="middle">SUCCESS · PARTIAL · FAILED · TIMEOUT</text><text class="ts" x="655.0" y="89.5" text-anchor="middle">status covers the whole run</text><rect class="box warn" x="540" y="186" width="230" height="58" rx="7"/><text class="tt warnt" x="655.0" y="211.0" text-anchor="middle">Quarantine</text><text class="ts" x="655.0" y="227.0" text-anchor="middle">rejected rows + reason</text><rect class="box accent" x="540" y="300" width="230" height="100" rx="7"/><text class="tt accentt" x="655.0" y="331.0" text-anchor="middle">Canonical store</text><text class="ts" x="655.0" y="347.0" text-anchor="middle">append-only versioned facts</text><text class="ts" x="655.0" y="362.0" text-anchor="middle">crosswalk · conflict register</text><text class="ts" x="655.0" y="377.0" text-anchor="middle">entitlement facts</text><rect class="box " x="800" y="222" width="180" height="72" rx="7"/><text class="tt t" x="890.0" y="246.5" text-anchor="middle">Entitlement revision +1</text><text class="ts" x="890.0" y="262.5" text-anchor="middle">same transaction,</text><text class="ts" x="890.0" y="277.5" text-anchor="middle">only if coverage changed</text><rect class="box " x="800" y="340" width="180" height="72" rx="7"/><text class="tt t" x="890.0" y="364.5" text-anchor="middle">Context service</text><text class="ts" x="890.0" y="380.5" text-anchor="middle">point-in-time reads</text><text class="ts" x="890.0" y="395.5" text-anchor="middle">by as_of + known_as_of</text><text class="zl" x="20.0" y="22.0" text-anchor="start">FIVE FEEDS FROM THE SEEDED GENERATOR, EACH WITH A MANIFEST</text></svg>
