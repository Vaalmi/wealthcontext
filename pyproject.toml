[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wealthcontext"
version = "0.1.0"
description = "Governed wealth-management context over synthetic data"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "anthropic==2.3.0",
  "fastapi==0.162.0",
  "google-genai==2.34.0",
  "httpx2==2.16.0",
  "jinja2==3.1.6",
  "mcp==2.3.0",
  "openai==3.42.0",
  "opentelemetry-sdk==1.45.1",
  "pydantic==2.14.2",
  "pyjwt[crypto]==2.15.1",
  "pyyaml==6.0.3",
  "uvicorn==0.54.0",
]

[dependency-groups]
browser = ["playwright==1.64.1"]
dev = [
  "hypothesis==6.170.14",
  "jsonschema>=4.26,<5",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[project.scripts]
wealthcontext = "wealthcontext.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wealthcontext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests", "reference_oracle", "scripts/build_bundle.py", "scripts/check_stdio.py"]
venvPath = "."
venv = ".venv"
